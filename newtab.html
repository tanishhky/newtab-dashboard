<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="icons/gargantua.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/gargantua-32.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg" aria-hidden="true">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
  </div>

  <main class="shell">
    <header class="top">
      <div>
        <p class="date" id="date"></p>
        <h1 id="greeting">Welcome</h1>
      </div>
      <time class="clock" id="clock" datetime=""></time>
    </header>

    <div class="grid">
      <div class="col">
      <section class="card jobs" aria-labelledby="jobs-title">
        <header class="card-head">
          <h2 id="jobs-title">Job Hunt</h2>
          <button class="open-btn" id="jobs-open" type="button" title="Open the job dashboard. Cmd-click for a new tab.">
            Open dashboard <kbd>J</kbd>
          </button>
        </header>
        <dl class="stats" id="jobs-stats"></dl>

        <h3 class="section">In motion</h3>
        <ul class="rows" id="jobs-motion"></ul>

        <h3 class="section">Ready to submit</h3>
        <ul class="rows" id="jobs-ready"></ul>

        <p class="note" id="jobs-note" hidden></p>
        <p class="stamp" id="jobs-updated"></p>
      </section>

      <section class="card practice" aria-labelledby="practice-title">
        <header class="card-head">
          <h2 id="practice-title">Practice</h2>
        </header>
        <ul class="tiles" id="practice-list"></ul>
      </section>

      <section class="card links" aria-labelledby="links-title">
        <header class="card-head">
          <h2 id="links-title">Quick links</h2>
        </header>
        <ul class="chips" id="link-list"></ul>
      </section>
      </div>
      <div class="col">
      <section class="card calendar" aria-labelledby="cal-title">
        <header class="card-head">
          <h2 id="cal-title">Next 7 days</h2>
          <a class="text-link" id="cal-open" href="#">Open calendar</a>
        </header>
        <div class="agenda" id="agenda"></div>
        <p class="stamp" id="cal-stamp"></p>
      </section>

      <section class="card deadlines" aria-labelledby="dl-title">
        <header class="card-head">
          <h2 id="dl-title">Deadlines</h2>
        </header>
        <ul class="rows" id="deadline-list"></ul>
      </section>
      </div>
    </div>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
