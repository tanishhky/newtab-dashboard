<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="icons/gargantua.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/gargantua-32.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg" aria-hidden="true">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
  </div>

  <main class="shell">
    <header class="top">
      <div>
        <p class="date" id="date"></p>
        <h1 id="greeting">Welcome</h1>
      </div>
      <time class="clock" id="clock" datetime=""></time>
    </header>

    <div class="grid">
      <div class="col">
      <section class="card jobs" aria-labelledby="jobs-title">
        <header class="card-head">
          <h2 id="jobs-title">Job Hunt</h2>
          <button class="open-btn" id="jobs-open" type="button" title="Open the job dashboard. Cmd-click for a new tab.">
            Open dashboard <kbd>J</kbd>
          </button>
        </header>
        <dl class="stats" id="jobs-stats"></dl>

        <h3 class="section">In motion</h3>
        <ul class="rows" id="jobs-motion"></ul>

        <h3 class="section">Ready to submit</h3>
        <ul class="rows" id="jobs-ready"></ul>

        <p class="note" id="jobs-note" hidden></p>
        <p class="stamp" id="jobs-updated"></p>
      </section>

      <section class="card library" aria-labelledby="lib-title">
        <header class="card-head">
          <h2 id="lib-title">Library</h2>
          <span class="meta">artifacts and books</span>
        </header>
        <div id="library"></div>
        <p class="note" id="library-note" hidden></p>
      </section>
      </div>
      <div class="col">
      <section class="card calendar" aria-labelledby="cal-title">
        <header class="card-head">
          <h2 id="cal-title">Next 7 days</h2>
          <a class="text-link" id="cal-open" href="#">Open calendar</a>
        </header>
        <div class="agenda" id="agenda"></div>
        <p class="stamp" id="cal-stamp"></p>
      </section>

      <section class="card deadlines" aria-labelledby="dl-title">
        <header class="card-head">
          <h2 id="dl-title">Deadlines</h2>
        </header>
        <ul class="rows" id="deadline-list"></ul>
      </section>

      <section class="card links" aria-labelledby="links-title">
        <header class="card-head">
          <h2 id="links-title">Quick links</h2>
        </header>
        <ul class="chips" id="link-list"></ul>
      </section>
      </div>
    </div>

    <section class="card prep" aria-labelledby="prep-title">
      <header class="card-head">
        <div class="head-left">
          <h2 id="prep-title">Assessment prep</h2>
          <button class="info-btn" id="prep-info-btn" type="button" aria-label="About this card: purpose and time to dedicate" aria-expanded="false" aria-controls="prep-plan">i</button>
        </div>
        <div class="head-right">
          <span class="meta" id="prep-meta"></span>
          <button class="open-btn" id="prep-next" type="button" title="Opens the highest-priority item not yet ticked">Start next block</button>
        </div>
      </header>
      <div class="info-panel" id="prep-plan" hidden></div>
      <div class="prep-groups" id="prep-groups"></div>
      <p class="note" id="prep-note" hidden></p>
    </section>

  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
